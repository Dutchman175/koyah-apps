<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4136">
  <title>A3 Testing — Koyah Apps</title>
  <style>
    :root {
      --forest: #1d4136;
      --forest-deep: #132e26;
      --pine: #245447;
      --teal: #108474;
      --teal-press: #0c6a5d;
      --mint: #95c9b4;
      --mint-soft: #c5f7f0;
      --cream: #f4faf7;
      --card: #ffffff;
      --ink: #1c1c1c;
      --muted: #4d635c;
      --line: #d5e6df;
      --shadow: 0 12px 32px rgba(29, 65, 54, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 0% -10%, rgba(16, 132, 116, 0.10), transparent 55%),
        radial-gradient(700px 440px at 100% 0%, rgba(255, 255, 255, 0.04), transparent 50%),
        linear-gradient(180deg, #4a504c 0%, #424844 45%, #3a403c 100%);
      padding:
        max(28px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(48px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }
    .wrap {
      width: min(760px, 100%);
      margin: 0 auto;
    }
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, var(--forest) 0%, var(--pine) 55%, #1a5246 100%);
      color: #f7fffb;
      border-radius: 22px;
      padding: 28px 24px 24px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -50px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(197, 247, 240, 0.28), transparent 70%);
      pointer-events: none;
    }
    .eyebrow {
      display: inline-block;
      margin: 0 0 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(197, 247, 240, 0.16);
      border: 1px solid rgba(197, 247, 240, 0.28);
      color: var(--mint-soft);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 5vw, 2.45rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-weight: 780;
    }
    .subtitle {
      margin: 0;
      max-width: 36ch;
      color: rgba(247, 255, 251, 0.82);
      font-size: 1.02rem;
      line-height: 1.45;
    }
    .stack {
      display: grid;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(29, 65, 54, 0.08);
      padding: 18px 18px 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--forest-deep);
    }
    .types {
      display: grid;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .types { grid-template-columns: 1fr 1fr; }
    }
    .yn {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }
    button:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 2px;
    }
    .choice {
      display: grid;
      gap: 2px;
      width: 100%;
      min-height: 64px;
      padding: 12px 14px;
      text-align: left;
      color: var(--ink);
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
    }
    .yn .choice {
      min-height: 48px;
      place-items: center;
      text-align: center;
      font-weight: 750;
      font-size: 1.05rem;
      color: var(--forest-deep);
    }
    .choice[aria-pressed="true"] {
      background: #fff;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(16, 132, 116, 0.2);
    }
    .choice-name {
      font-weight: 750;
      font-size: 1.05rem;
      color: var(--forest-deep);
    }
    .picked {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.4;
    }
    .primary, .ghost {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .primary {
      border: 0;
      background: var(--teal);
      color: #fff;
      box-shadow: 0 6px 14px rgba(16, 132, 116, 0.28);
    }
    .primary:hover { background: var(--teal-press); }
    .primary:active { background: var(--teal-press); }
    .ghost {
      background: #fff;
      color: var(--forest-deep);
      border: 1px solid var(--line);
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
      box-shadow: none;
    }
    .empty, .note {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }
    .drawn {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .drawn {
      display: grid;
      gap: 10px;
    }
    .drawn li {
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .part-name {
      display: block;
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--forest-deep);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .part-section {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.35;
    }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .mark, .swap-choice {
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--forest-deep);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .mark[aria-pressed="true"] {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }
    .swap-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .row-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }
    a.ghost {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    #resultCard, #grindCard, #home, #changeType { scroll-margin-top: 12px; }
    footer {
      margin-top: 22px;
      color: rgba(197, 247, 240, 0.72);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    footer a {
      color: var(--mint-soft);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <p class="eyebrow">Shop floor toolkit</p>
      <h1>A3 Testing</h1>
      <p class="subtitle">Pick a production type.</p>
    </header>

    <main class="stack">
      <a class="ghost" id="home" href="index.html">Home</a>
      <button class="ghost" id="changeType" type="button" hidden>Change Production Type</button>

      <section class="card" id="typeCard">
        <h2>Production type</h2>
        <div class="types" id="types" role="group" aria-label="Production type"></div>
      </section>

      <section class="card" id="grindCard" hidden>
        <p class="picked" id="grindType"></p>
        <h2>Are you grinding?</h2>
        <div class="yn" role="group" aria-label="Are you grinding?">
          <button class="choice" id="grindYes" type="button" aria-pressed="false">Yes</button>
          <button class="choice" id="grindNo" type="button" aria-pressed="false">No</button>
        </div>
      </section>

      <section class="card" id="resultCard" hidden>
        <p class="picked" id="resultType"></p>
        <h2>Test these</h2>
        <div id="result" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <a href="index.html">All apps</a>
    </footer>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = "koyah-a3-testing-v2";
      var ENCAP_PARTS = [
        "Encapsulator auger",
        "Empty capsule hopper",
        "Rings",
        "Capsule dispenser",
        "Pressing prongs"
      ];
      var GROUP_ORDER = ["powder", "grinding", "blending", "counter", "polisher", "encap1", "encap2", "pouching", "tools"];
      var GROUPS = {
        powder: {
          name: "Powder Fill",
          machineName: "Auger Filler",
          encap: false,
          parts: [
            "Agitator paddles",
            "Powder hopper",
            "D-blade",
            "Driveshaft",
            "Plastic tube",
            "Auger",
            "Metal tube"
          ]
        },
        counter: {
          name: "Capsule Counter 2",
          machineName: "Capsule Counter 2",
          encap: true,
          parts: [
            "Tray 1",
            "Tray 2",
            "Tray 3",
            "Capsule hopper",
            "Metal Flaps",
            "Dispensing chute"
          ]
        },
        polisher: {
          name: "Capsule Polisher",
          machineName: "Capsule Polisher",
          encap: true,
          parts: ["Brush", "Casing", "Ending Chute"]
        },
        encap1: {
          name: "Encapsulator 1",
          machineName: "Encapsulator 1",
          encap: true,
          parts: ENCAP_PARTS.slice()
        },
        encap2: {
          name: "Encapsulator 2",
          machineName: "Encapsulator 2",
          encap: true,
          parts: ENCAP_PARTS.slice()
        },
        pouching: {
          name: "Pouching machine",
          machineName: "DoyPack Machine",
          encap: true,
          parts: ["Separating prongs things"]
        },
        grinding: {
          name: "Grinding",
          machineName: "Grinder",
          encap: false,
          parts: [
            "Grinder Body",
            "Grinder hopper",
            "Grinder dispensing chute",
            "Grinding Ring",
            "Grinder inside"
          ]
        },
        blending: {
          name: "Blending",
          machineName: "Ribbon Blender",
          encap: false,
          parts: ["Blade", "Center Shaft", "Lid", "Walls", "Dispensing Hole"]
        },
        tools: {
          name: "Tools",
          machineName: "Tools",
          encap: false,
          parts: ["Scoops", "Spatula", "Table top"]
        }
      };
      var TYPES = [
        {
          id: "encapsulation",
          name: "Encapsulation",
          askGrinding: true,
          yes: 4,
          no: 3,
          required: [],
          requiredOneOf: ["encap1", "encap2"],
          allowed: ["counter", "polisher", "encap1", "encap2", "pouching", "tools"]
        },
        {
          id: "encapsulation-blend",
          name: "Encapsulation Blend",
          askGrinding: true,
          yes: 5,
          no: 4,
          required: ["blending"],
          requiredOneOf: ["encap1", "encap2"],
          allowed: ["counter", "polisher", "encap1", "encap2", "pouching", "blending", "tools"]
        },
        {
          id: "powder",
          name: "Powder Fill",
          askGrinding: true,
          yes: 3,
          no: 2,
          required: ["powder"],
          allowed: ["powder", "tools"]
        },
        {
          id: "powder-blend",
          name: "Powder Fill Blend",
          askGrinding: true,
          yes: 4,
          no: 3,
          required: ["powder", "blending"],
          allowed: ["powder", "blending", "tools"]
        },
        {
          id: "empty",
          name: "Empty Capsules",
          askGrinding: false,
          count: 2,
          required: [],
          allowed: ["tools"]
        },
        {
          id: "wip-blend",
          name: "WIP Blend",
          askGrinding: true,
          yes: 3,
          no: 2,
          required: ["blending"],
          allowed: ["blending", "tools"]
        },
        {
          id: "wip-encap",
          name: "WIP Encapsulation",
          askGrinding: true,
          yes: 4,
          no: 3,
          required: [],
          requiredOneOf: ["encap1", "encap2"],
          allowed: ["polisher", "encap1", "encap2", "tools"]
        },
        {
          id: "wip-grind",
          name: "WIP Grind",
          askGrinding: false,
          count: 2,
          required: ["grinding"],
          allowed: ["grinding", "tools"]
        },
        {
          id: "wip-pouch",
          name: "WIP Capsules Pouching",
          askGrinding: false,
          count: 2,
          required: ["counter", "pouching"],
          allowed: ["counter", "pouching", "tools"]
        }
      ];

      function typeById(id) {
        for (var i = 0; i < TYPES.length; i++) {
          if (TYPES[i].id === id) return TYPES[i];
        }
        return null;
      }

      function fullRemaining() {
        var remaining = {};
        GROUP_ORDER.forEach(function (id) {
          remaining[id] = GROUPS[id].parts.slice();
        });
        return remaining;
      }

      function maxSlots(groupId) {
        if (GROUPS[groupId].encap) return 1;
        return GROUPS[groupId].parts.length;
      }

      function testCount(type, grinding) {
        if (!type) return null;
        if (!type.askGrinding) return type.count;
        if (grinding === true) return type.yes;
        if (grinding === false) return type.no;
        return null;
      }

      function planFor(type, grinding) {
        var required = type.required.slice();
        if (type.requiredOneOf && type.requiredOneOf.length) {
          required.push(type.requiredOneOf[Math.floor(Math.random() * type.requiredOneOf.length)]);
        }
        var allowed = type.allowed.slice();
        if (type.askGrinding && grinding === true) {
          required.push("grinding");
          if (allowed.indexOf("grinding") === -1) allowed.push("grinding");
        }
        return {
          required: required,
          allowed: allowed,
          count: testCount(type, grinding)
        };
      }

      function currentStep() {
        var type = typeById(state.selected);
        if (!type) return "type";
        if (type.askGrinding && state.grinding !== true && state.grinding !== false) return "grind";
        return "result";
      }

      function fillList() {
        var type = typeById(state.selected);
        if (!type || !testCount(type, state.grinding)) return false;
        var remaining = JSON.parse(JSON.stringify(state.remaining));
        var drawn = drawFrom(remaining, type, state.grinding);
        if (!drawn) return false;
        state.remaining = remaining;
        state.last = drawn;
        saveState();
        return true;
      }

      function chooseSlots(required, allowed, count) {
        var slots = required.slice();
        var guard = 0;
        while (slots.length < count && guard < 40) {
          guard++;
          var options = [];
          allowed.forEach(function (id) {
            var used = 0;
            slots.forEach(function (slot) {
              if (slot === id) used++;
            });
            if (used < maxSlots(id)) options.push(id);
          });
          if (!options.length) break;
          slots.push(options[Math.floor(Math.random() * options.length)]);
        }
        return slots;
      }

      function take(remaining, groupId, blocked) {
        var catalog = GROUPS[groupId].parts;
        var open = remaining[groupId].filter(function (name) { return !blocked[name]; });
        if (!open.length) {
          remaining[groupId] = catalog.filter(function (name) { return !blocked[name]; });
          open = remaining[groupId].slice();
        }
        if (!open.length) return null;
        var pick = open[Math.floor(Math.random() * open.length)];
        remaining[groupId] = remaining[groupId].filter(function (name) { return name !== pick; });
        return pick;
      }

      function drawFrom(remaining, type, grinding) {
        var spec = planFor(type, grinding);
        if (!spec.count) return null;
        var slots = chooseSlots(spec.required, spec.allowed, spec.count);
        if (slots.length !== spec.count) return null;
        var blocked = {};
        var drawn = [];
        for (var i = 0; i < slots.length; i++) {
          var groupId = slots[i];
          if (!blocked[groupId]) blocked[groupId] = {};
          var name = take(remaining, groupId, blocked[groupId]);
          if (!name) return null;
          blocked[groupId][name] = true;
          drawn.push({ group: groupId, name: name });
        }
        drawn.sort(function (a, b) {
          return GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group);
        });
        return drawn;
      }

      function sanitizeRemaining(saved) {
        var remaining = {};
        GROUP_ORDER.forEach(function (id) {
          var catalog = GROUPS[id].parts;
          var known = {};
          catalog.forEach(function (name) { known[name] = true; });
          if (saved && Array.isArray(saved[id])) {
            var seen = {};
            remaining[id] = [];
            saved[id].forEach(function (name) {
              if (known[name] && !seen[name]) {
                seen[name] = true;
                remaining[id].push(name);
              }
            });
          } else {
            remaining[id] = catalog.slice();
          }
        });
        return remaining;
      }

      function blankState() {
        return {
          selected: null,
          grinding: null,
          remaining: fullRemaining(),
          last: null
        };
      }

      function loadState() {
        var state = blankState();
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return state;
          var data = JSON.parse(raw);
          if (!data || typeof data !== "object") return state;
          state.remaining = sanitizeRemaining(data.remaining);
        } catch (err) {
          return blankState();
        }
        return state;
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function returnPart(groupId, name) {
        var catalog = GROUPS[groupId].parts;
        if (catalog.indexOf(name) === -1) return;
        var pool = state.remaining[groupId];
        if (pool.indexOf(name) !== -1) return;
        pool.push(name);
      }

      function consumePart(groupId, name) {
        state.remaining[groupId] = state.remaining[groupId].filter(function (part) {
          return part !== name;
        });
      }

      function listedElsewhere(item) {
        var names = {};
        if (!state.last) return names;
        state.last.forEach(function (other) {
          if (other !== item && other.group === item.group) names[other.name] = true;
        });
        return names;
      }

      function switchChoices(item) {
        var listed = listedElsewhere(item);
        return state.remaining[item.group].filter(function (name) {
          return name !== item.name && !listed[name];
        });
      }

      function setMark(item, mark) {
        if (item.mark === mark) return;
        item.mark = mark;
        item.picking = false;
        item.note = "";
        if (mark === "used") consumePart(item.group, item.name);
        if (mark === "not") returnPart(item.group, item.name);
        saveState();
        renderResult();
      }

      function openSwitch(item) {
        var choices = switchChoices(item);
        if (!choices.length) {
          item.picking = false;
          item.note = "No other locations left.";
          renderResult();
          return;
        }
        item.note = "";
        item.picking = !item.picking;
        renderResult();
      }

      function applySwitch(item, name) {
        returnPart(item.group, item.name);
        consumePart(item.group, name);
        item.name = name;
        item.mark = null;
        item.picking = false;
        item.note = "";
        saveState();
        renderResult();
      }

      function renderResult() {
        var result = document.getElementById("result");
        clear(result);
        if (!state.last || !state.last.length) return;
        var list = document.createElement("ul");
        list.className = "drawn";
        state.last.forEach(function (item) {
          var row = document.createElement("li");
          row.setAttribute("data-group", item.group);
          row.setAttribute("data-name", item.name);
          var part = document.createElement("span");
          part.className = "part-name";
          part.textContent = item.name;
          var section = document.createElement("span");
          section.className = "part-section";
          section.textContent = GROUPS[item.group].machineName;
          row.appendChild(part);
          row.appendChild(section);

          var actions = document.createElement("div");
          actions.className = "row-actions";
          var used = document.createElement("button");
          used.type = "button";
          used.className = "mark";
          used.textContent = "Used";
          used.setAttribute("aria-pressed", item.mark === "used" ? "true" : "false");
          used.addEventListener("click", function () { setMark(item, "used"); });
          var notUsed = document.createElement("button");
          notUsed.type = "button";
          notUsed.className = "mark";
          notUsed.textContent = "Not used";
          notUsed.setAttribute("aria-pressed", item.mark === "not" ? "true" : "false");
          notUsed.addEventListener("click", function () { setMark(item, "not"); });
          var swap = document.createElement("button");
          swap.type = "button";
          swap.className = "mark";
          swap.textContent = "Switch";
          swap.setAttribute("aria-pressed", item.picking ? "true" : "false");
          swap.addEventListener("click", function () { openSwitch(item); });
          actions.appendChild(used);
          actions.appendChild(notUsed);
          actions.appendChild(swap);
          row.appendChild(actions);

          if (item.note) {
            var note = document.createElement("p");
            note.className = "row-note";
            note.textContent = item.note;
            row.appendChild(note);
          }

          if (item.picking) {
            var picker = document.createElement("div");
            picker.className = "swap-list";
            switchChoices(item).forEach(function (name) {
              var choice = document.createElement("button");
              choice.type = "button";
              choice.className = "swap-choice";
              choice.textContent = name;
              choice.addEventListener("click", function () { applySwitch(item, name); });
              picker.appendChild(choice);
            });
            row.appendChild(picker);
          }

          list.appendChild(row);
        });
        result.appendChild(list);
      }

      function answerLine(type) {
        var line = type.name;
        if (type.askGrinding && state.grinding === true) line += ". Grinding.";
        if (type.askGrinding && state.grinding === false) line += ". Not grinding.";
        return line;
      }

      function render() {
        var type = typeById(state.selected);
        var step = currentStep();
        var buttons = document.querySelectorAll("#types .choice");
        for (var i = 0; i < buttons.length; i++) {
          var on = buttons[i].getAttribute("data-type") === state.selected;
          buttons[i].setAttribute("aria-pressed", on ? "true" : "false");
        }
        typeCard.hidden = step !== "type";
        grindCard.hidden = step !== "grind";
        if (step === "grind" && type) grindType.textContent = type.name;
        grindYes.setAttribute("aria-pressed", state.grinding === true ? "true" : "false");
        grindNo.setAttribute("aria-pressed", state.grinding === false ? "true" : "false");
        var showResult = step === "result" && state.last && state.last.length;
        resultCard.hidden = !showResult;
        changeTypeBtn.hidden = step === "type";
        if (showResult && type) resultType.textContent = answerLine(type);
        if (step === "result") renderResult();
      }

      var state = loadState();
      var changeTypeBtn = document.getElementById("changeType");
      var resultCard = document.getElementById("resultCard");
      var typeCard = document.getElementById("typeCard");
      var grindCard = document.getElementById("grindCard");
      var grindType = document.getElementById("grindType");
      var resultType = document.getElementById("resultType");
      var grindYes = document.getElementById("grindYes");
      var grindNo = document.getElementById("grindNo");
      var typesEl = document.getElementById("types");

      TYPES.forEach(function (type) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.setAttribute("data-type", type.id);
        button.setAttribute("aria-pressed", "false");
        var name = document.createElement("span");
        name.className = "choice-name";
        name.textContent = type.name;
        button.appendChild(name);
        typesEl.appendChild(button);
      });

      if (currentStep() === "result" && (!state.last || !state.last.length)) fillList();

      typesEl.addEventListener("click", function (event) {
        var button = event.target.closest("button[data-type]");
        if (!button) return;
        state.selected = button.getAttribute("data-type");
        state.grinding = null;
        state.last = null;
        if (typeById(state.selected).askGrinding) saveState();
        else fillList();
        render();
        if (currentStep() === "grind") grindCard.scrollIntoView({ block: "start" });
        else if (currentStep() === "result") resultCard.scrollIntoView({ block: "start" });
      });

      grindYes.addEventListener("click", function () {
        if (!typeById(state.selected) || !typeById(state.selected).askGrinding) return;
        state.grinding = true;
        state.last = null;
        fillList();
        render();
        if (!resultCard.hidden) resultCard.scrollIntoView({ block: "start" });
      });

      grindNo.addEventListener("click", function () {
        if (!typeById(state.selected) || !typeById(state.selected).askGrinding) return;
        state.grinding = false;
        state.last = null;
        fillList();
        render();
        if (!resultCard.hidden) resultCard.scrollIntoView({ block: "start" });
      });

      changeTypeBtn.addEventListener("click", function () {
        state.selected = null;
        state.grinding = null;
        state.last = null;
        saveState();
        render();
      });

      window.addEventListener("pageshow", function (event) {
        if (!event.persisted) return;
        state.selected = null;
        state.grinding = null;
        state.last = null;
        saveState();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
