<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4136">
  <title>A3 Testing — Koyah Apps</title>
  <style>
    :root {
      --forest: #1d4136;
      --forest-deep: #132e26;
      --pine: #245447;
      --teal: #108474;
      --teal-press: #0c6a5d;
      --mint: #95c9b4;
      --mint-soft: #c5f7f0;
      --cream: #f4faf7;
      --card: #ffffff;
      --ink: #1c1c1c;
      --muted: #4d635c;
      --line: #d5e6df;
      --shadow: 0 12px 32px rgba(29, 65, 54, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 0% -10%, rgba(16, 132, 116, 0.10), transparent 55%),
        radial-gradient(700px 440px at 100% 0%, rgba(255, 255, 255, 0.04), transparent 50%),
        linear-gradient(180deg, #4a504c 0%, #424844 45%, #3a403c 100%);
      padding:
        max(28px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(48px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }
    .wrap {
      width: min(760px, 100%);
      margin: 0 auto;
    }
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, var(--forest) 0%, var(--pine) 55%, #1a5246 100%);
      color: #f7fffb;
      border-radius: 22px;
      padding: 28px 24px 24px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -50px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(197, 247, 240, 0.28), transparent 70%);
      pointer-events: none;
    }
    .eyebrow {
      display: inline-block;
      margin: 0 0 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(197, 247, 240, 0.16);
      border: 1px solid rgba(197, 247, 240, 0.28);
      color: var(--mint-soft);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 5vw, 2.45rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-weight: 780;
    }
    .subtitle {
      margin: 0;
      max-width: 34ch;
      color: rgba(247, 255, 251, 0.82);
      font-size: 1.02rem;
      line-height: 1.45;
    }
    .stack {
      display: grid;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(29, 65, 54, 0.08);
      padding: 18px 18px 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--forest-deep);
    }
    .types {
      display: grid;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .types { grid-template-columns: 1fr 1fr; }
    }
    button {
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }
    button:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 2px;
    }
    .choice {
      display: grid;
      gap: 2px;
      width: 100%;
      min-height: 64px;
      padding: 12px 14px;
      text-align: left;
      color: var(--ink);
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
    }
    .choice[aria-pressed="true"] {
      background: #fff;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(16, 132, 116, 0.2);
    }
    .choice-name {
      font-weight: 750;
      font-size: 1.05rem;
      color: var(--forest-deep);
    }
    .choice-rule {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }
    .primary, .ghost {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .primary {
      border: 0;
      background: var(--teal);
      color: #fff;
      box-shadow: 0 6px 14px rgba(16, 132, 116, 0.28);
    }
    .primary:hover { background: var(--teal-press); }
    .primary:active { background: var(--teal-press); }
    .ghost {
      background: #fff;
      color: var(--forest-deep);
      border: 1px solid var(--line);
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
      box-shadow: none;
    }
    .empty, .count, .note {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }
    .note {
      margin-top: 12px;
      color: var(--forest-deep);
    }
    .drawn, .left-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .drawn {
      display: grid;
      gap: 10px;
    }
    .drawn li {
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .part-name {
      display: block;
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--forest-deep);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .part-section {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.35;
    }
    #resultCard { scroll-margin-top: 12px; }
    .group-name {
      margin: 16px 0 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--forest-deep);
    }
    .group-name:first-child { margin-top: 4px; }
    .left-list li {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 1rem;
      line-height: 1.35;
    }
    .left-list li:last-child { border-bottom: 0; }
    footer {
      margin-top: 22px;
      color: rgba(197, 247, 240, 0.72);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    footer a {
      color: var(--mint-soft);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <p class="eyebrow">Shop floor toolkit</p>
      <h1>A3 Testing</h1>
      <p class="subtitle">Pick a production type. Draw the parts to test this time.</p>
    </header>

    <main class="stack">
      <section class="card">
        <h2>Production type</h2>
        <div class="types" id="types" role="group" aria-label="Production type"></div>
      </section>

      <button class="primary" id="draw" type="button" disabled>Draw next</button>

      <section class="card" id="resultCard" hidden>
        <h2>Test these</h2>
        <div id="result" aria-live="polite"></div>
      </section>

      <section class="card" id="leftCard" hidden>
        <h2>Still to test</h2>
        <p class="count" id="leftCount"></p>
        <div id="left"></div>
      </section>

      <button class="ghost" id="reset" type="button" hidden>Start this type over</button>
    </main>

    <footer>
      <a href="index.html">All apps</a>
    </footer>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = "koyah-a3-testing";
      var TYPES = [
        {
          id: "powder",
          name: "Powder Fill",
          rule: "Two parts each draw",
          count: 2,
          onePerSection: false,
          sections: [
            {
              name: "",
              parts: [
                "Agitator paddles",
                "Powder hopper",
                "D-blade",
                "Driveshaft",
                "Plastic tube",
                "Auger",
                "Metal tube",
                "Spatula"
              ]
            }
          ]
        },
        {
          id: "encapsulations",
          name: "Encapsulations",
          rule: "Three parts, one per machine",
          count: 3,
          onePerSection: true,
          sections: [
            {
              name: "Capsule Counter 2",
              parts: [
                "Tray 1",
                "Tray 2",
                "Tray 3",
                "Capsule hopper",
                "Metal Flaps",
                "Dispensing chute"
              ]
            },
            {
              name: "Capsule Polisher",
              parts: ["Brush", "Casing", "Ending Chute"]
            },
            {
              name: "Encapsulators",
              parts: [
                "Encapsulator auger",
                "Empty capsule hopper",
                "Rings",
                "Capsule dispenser",
                "Pressing prongs"
              ]
            },
            {
              name: "Pouching machine",
              parts: ["Separating prongs things"]
            },
            {
              name: "Tools",
              parts: ["Scoops", "Spatula"]
            }
          ]
        },
        {
          id: "grinding",
          name: "Grinding",
          rule: "One part each draw",
          count: 1,
          onePerSection: false,
          sections: [
            {
              name: "",
              parts: [
                "Grinder Body",
                "Grinder hopper",
                "Grinder dispensing chute",
                "Grinding Ring",
                "Grinder inside"
              ]
            }
          ]
        },
        {
          id: "blending",
          name: "Blending",
          rule: "One part each draw",
          count: 1,
          onePerSection: false,
          sections: [
            {
              name: "",
              parts: ["Blade", "Center shaft", "Lid", "Walls", "Dispensing hole"]
            }
          ]
        }
      ];

      function typeById(id) {
        for (var i = 0; i < TYPES.length; i++) {
          if (TYPES[i].id === id) return TYPES[i];
        }
        return null;
      }

      function allNames(type) {
        var names = [];
        type.sections.forEach(function (section) {
          section.parts.forEach(function (name) { names.push(name); });
        });
        return names;
      }

      function sectionFor(type, name) {
        for (var i = 0; i < type.sections.length; i++) {
          if (type.sections[i].parts.indexOf(name) !== -1) return type.sections[i].name;
        }
        return "";
      }

      function shuffle(list) {
        var copy = list.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      function freshPool(type) {
        return { remaining: allNames(type), last: null, partial: false };
      }

      function sanitizePool(type, pool) {
        var known = {};
        allNames(type).forEach(function (name) { known[name] = true; });
        var remaining = [];
        var seen = {};
        if (pool && Array.isArray(pool.remaining)) {
          pool.remaining.forEach(function (name) {
            if (known[name] && !seen[name]) {
              seen[name] = true;
              remaining.push(name);
            }
          });
        } else {
          remaining = allNames(type);
        }
        var last = null;
        if (pool && Array.isArray(pool.last)) {
          last = [];
          var seenLast = {};
          pool.last.forEach(function (name) {
            if (known[name] && !seenLast[name]) {
              seenLast[name] = true;
              last.push(name);
            }
          });
        }
        return {
          remaining: remaining,
          last: last,
          partial: !!(pool && pool.partial && last && last.length)
        };
      }

      function blankState() {
        var pools = {};
        TYPES.forEach(function (type) {
          pools[type.id] = freshPool(type);
        });
        return { selected: null, pools: pools };
      }

      function loadState() {
        var state = blankState();
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return state;
          var data = JSON.parse(raw);
          if (!data || typeof data !== "object") return state;
          if (typeById(data.selected)) state.selected = data.selected;
          TYPES.forEach(function (type) {
            var saved = data.pools && data.pools[type.id];
            if (saved) state.pools[type.id] = sanitizePool(type, saved);
          });
        } catch (err) {
          return blankState();
        }
        return state;
      }

      function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function openSections(type, remaining) {
        var have = {};
        remaining.forEach(function (name) { have[name] = true; });
        var open = [];
        type.sections.forEach(function (section) {
          var choices = section.parts.filter(function (name) { return have[name]; });
          if (choices.length) open.push(choices);
        });
        return open;
      }

      function pick(type, remaining) {
        if (type.onePerSection) {
          var open = openSections(type, remaining);
          if (open.length >= type.count) {
            return {
              parts: shuffle(open).slice(0, type.count).map(function (choices) {
                return shuffle(choices)[0];
              }),
              partial: false
            };
          }
          return {
            parts: shuffle(open).map(function (choices) {
              return shuffle(choices)[0];
            }),
            partial: true
          };
        }
        if (remaining.length >= type.count) {
          return { parts: shuffle(remaining).slice(0, type.count), partial: false };
        }
        return { parts: remaining.slice(), partial: true };
      }

      function drawNext(state, typeId) {
        var type = typeById(typeId);
        var pool = state.pools[typeId];
        if (!pool.remaining.length) pool.remaining = allNames(type);
        var picked = pick(type, pool.remaining);
        if (!picked.parts.length) return pool;
        pool.last = picked.parts;
        pool.partial = picked.partial;
        if (picked.partial) {
          pool.remaining = [];
        } else {
          var used = {};
          picked.parts.forEach(function (name) { used[name] = true; });
          pool.remaining = pool.remaining.filter(function (name) { return !used[name]; });
        }
        return pool;
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function renderResult(type, pool) {
        var result = document.getElementById("result");
        clear(result);
        if (!pool.last || !pool.last.length) {
          var empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "Draw to see what to test.";
          result.appendChild(empty);
          return;
        }
        var list = document.createElement("ul");
        list.className = "drawn";
        pool.last.forEach(function (name) {
          var item = document.createElement("li");
          var part = document.createElement("span");
          part.className = "part-name";
          part.textContent = name;
          item.appendChild(part);
          var section = sectionFor(type, name);
          if (section) {
            var sub = document.createElement("span");
            sub.className = "part-section";
            sub.textContent = section;
            item.appendChild(sub);
          }
          list.appendChild(item);
        });
        result.appendChild(list);
        var noteText = "";
        if (pool.partial) {
          noteText = "A full set cannot be drawn. The next draw starts over.";
        } else if (!pool.remaining.length) {
          noteText = "The next draw starts over.";
        }
        if (noteText) {
          var note = document.createElement("p");
          note.className = "note";
          note.textContent = noteText;
          result.appendChild(note);
        }
      }

      function renderLeft(type, pool) {
        var count = pool.remaining.length;
        var countEl = document.getElementById("leftCount");
        if (count === 0) countEl.textContent = "None left.";
        else if (count === 1) countEl.textContent = "1 left.";
        else countEl.textContent = count + " left.";

        var have = {};
        pool.remaining.forEach(function (name) { have[name] = true; });
        var left = document.getElementById("left");
        clear(left);
        type.sections.forEach(function (section) {
          var names = section.parts.filter(function (name) { return have[name]; });
          if (!names.length) return;
          if (type.onePerSection && section.name) {
            var heading = document.createElement("h3");
            heading.className = "group-name";
            heading.textContent = section.name;
            left.appendChild(heading);
          }
          var list = document.createElement("ul");
          list.className = "left-list";
          names.forEach(function (name) {
            var item = document.createElement("li");
            item.textContent = name;
            list.appendChild(item);
          });
          left.appendChild(list);
        });
      }

      function render() {
        var buttons = document.querySelectorAll(".choice");
        for (var i = 0; i < buttons.length; i++) {
          var on = buttons[i].getAttribute("data-type") === state.selected;
          buttons[i].setAttribute("aria-pressed", on ? "true" : "false");
        }
        var type = typeById(state.selected);
        drawBtn.disabled = !type;
        resultCard.hidden = !type;
        leftCard.hidden = !type;
        resetBtn.hidden = !type;
        if (!type) return;
        resetBtn.textContent = "Start " + type.name + " over";
        var pool = state.pools[type.id];
        renderResult(type, pool);
        renderLeft(type, pool);
      }

      var state = loadState();
      var drawBtn = document.getElementById("draw");
      var resetBtn = document.getElementById("reset");
      var resultCard = document.getElementById("resultCard");
      var leftCard = document.getElementById("leftCard");
      var typesEl = document.getElementById("types");

      TYPES.forEach(function (type) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.setAttribute("data-type", type.id);
        button.setAttribute("aria-pressed", "false");
        var name = document.createElement("span");
        name.className = "choice-name";
        name.textContent = type.name;
        var rule = document.createElement("span");
        rule.className = "choice-rule";
        rule.textContent = type.rule;
        button.appendChild(name);
        button.appendChild(rule);
        typesEl.appendChild(button);
      });

      typesEl.addEventListener("click", function (event) {
        var button = event.target.closest("button[data-type]");
        if (!button) return;
        state.selected = button.getAttribute("data-type");
        saveState(state);
        render();
      });

      drawBtn.addEventListener("click", function () {
        if (!state.selected) return;
        drawNext(state, state.selected);
        saveState(state);
        render();
        resultCard.scrollIntoView({ block: "start" });
      });

      resetBtn.addEventListener("click", function () {
        if (!state.selected) return;
        var type = typeById(state.selected);
        state.pools[type.id] = freshPool(type);
        saveState(state);
        render();
      });

      render();
    })();
  </script>
</body>
</html>
